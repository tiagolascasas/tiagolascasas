<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    path, rect {
      fill: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      path, rect {
        fill: #38bdf8;
      }
    }
  </style>

  <!-- Top Pins (3 pins) -->
  <rect x="9.5" y="2.5" width="2.2" height="4.5" rx="1.1" />
  <rect x="14.9" y="2.5" width="2.2" height="4.5" rx="1.1" />
  <rect x="20.3" y="2.5" width="2.2" height="4.5" rx="1.1" />

  <!-- Bottom Pins (3 pins) -->
  <rect x="9.5" y="25" width="2.2" height="4.5" rx="1.1" />
  <rect x="14.9" y="25" width="2.2" height="4.5" rx="1.1" />
  <rect x="20.3" y="25" width="2.2" height="4.5" rx="1.1" />

  <!-- Left Pins (3 pins) -->
  <rect x="2.5" y="9.5" width="4.5" height="2.2" rx="1.1" />
  <rect x="2.5" y="14.9" width="4.5" height="2.2" rx="1.1" />
  <rect x="2.5" y="20.3" width="4.5" height="2.2" rx="1.1" />

  <!-- Right Pins (3 pins) -->
  <rect x="25" y="9.5" width="4.5" height="2.2" rx="1.1" />
  <rect x="25" y="14.9" width="4.5" height="2.2" rx="1.1" />
  <rect x="25" y="20.3" width="4.5" height="2.2" rx="1.1" />

  <!-- Outer Chip Package Frame (with inner cutout) -->
  <path fill-rule="evenodd" d="
    M 10 7
    L 22 7
    A 3 3 0 0 1 25 10
    L 25 22
    A 3 3 0 0 1 22 25
    L 10 25
    A 3 3 0 0 1 7 22
    L 7 10
    A 3 3 0 0 1 10 7 Z
    M 11 9.5
    A 1.5 1.5 0 0 0 9.5 11
    L 9.5 21
    A 1.5 1.5 0 0 0 11 22.5
    L 21 22.5
    A 1.5 1.5 0 0 0 22.5 21
    L 22.5 11
    A 1.5 1.5 0 0 0 21 9.5
    L 11 9.5 Z
  " />

  <!-- Inner Silicon Core -->
  <rect x="12" y="12" width="8" height="8" rx="1.5" />
</svg>
